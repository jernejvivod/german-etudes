<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- German Etudes app icon: a serif ß over a cloze blank, on a paper tile in the app's colours (src/styles.css).
       The tile follows Apple's macOS icon grid (824 × 824 at 100, corner radius 185). Render with npm run icon. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf9"/>
      <stop offset="1" stop-color="#eeece5"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#dedcd5" stroke-opacity="0.8" stroke-width="2"/>
  <text x="512" y="656" text-anchor="middle" font-family="ui-serif, 'New York', 'Iowan Old Style', Baskerville, Georgia, serif"
        font-weight="600" font-size="580" fill="url(#ink)">ß</text>
  <line x1="362" y1="730" x2="662" y2="730" stroke="#3b5bdb" stroke-opacity="0.38" stroke-width="22" stroke-linecap="round"/>
</svg>
